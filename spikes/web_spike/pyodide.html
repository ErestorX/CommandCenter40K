<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command Center 40K — the back end in the browser</title>
<style>
:root { /*PALETTE*/ }
body { background: var(--bg); color: var(--ink); font: 11pt "Segoe UI", system-ui, sans-serif; padding: 20px; }
pre { background: var(--field); border: 1px solid var(--line); padding: 12px; }
</style>
</head>
<body>
<!-- No server computes anything here: Python and numpy run in the page (Pyodide), on the back end's own
     files, unpacked from /backend.zip. What it costs is what this page measures. -->
<h3>The back end in the browser, with no server</h3>
<pre id="out">Loading Python…</pre>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.0/full/pyodide.js"></script>
<script>
(async () => {
  const out = document.getElementById("out"), t0 = performance.now();
  const pyodide = await loadPyodide();
  await pyodide.loadPackage("numpy");
  const loaded = performance.now() - t0;
  pyodide.unpackArchive(await (await fetch("/backend.zip")).arrayBuffer(), "zip");
  pyodide.globals.set("layout_json", JSON.stringify((await (await fetch("/api/board")).json()).layout));
  const report = JSON.parse(pyodide.runPython(`
import json, sys, time
from command_center.deploy.placement import ellipse_polygon
from command_center.deploy.sight import Obstacles, cast, fans
obstacles = Obstacles.from_layout(json.loads(layout_json))
outline, times = ellipse_polygon(14, 14, 6.5, 4.0, 0, n=72), []
for _ in range(20):
    t = time.perf_counter()
    seen = fans(cast(outline, 36, obstacles))
    times.append((time.perf_counter() - t) * 1000)
times.sort()
json.dumps({"python": sys.version.split()[0], "fans": len(seen), "sight_median_ms": round(times[10], 1)})
`));
  const zip = await (await fetch("/data.zip")).arrayBuffer();           // Wahapedia's CSVs, then one attack simulated
  pyodide.unpackArchive(zip, "zip");
  // The browser's Python is a 32-bit one: command_center/core/engine.py line 198 hands np.repeat 64-bit
  // counts, which it refuses there. Counts are narrowed here, for the measure; the app is not changed.
  pyodide.runPython(`
import numpy as np
_repeat = np.repeat
np.repeat = lambda a, repeats, axis=None: _repeat(a, np.asarray(repeats).astype(np.intp), axis)
`);
  pyodide.runPython(await (await fetch("/bench.py")).text());
  Object.assign(report, JSON.parse(pyodide.globals.get("bench")), {data_zip_mb: +(zip.byteLength / 1e6).toFixed(1)});
  const bytes = performance.getEntriesByType("resource").filter(r => r.name.includes("pyodide"))
                           .reduce((sum, r) => sum + r.transferSize, 0);
  Object.assign(report, {page: "pyodide", loaded_ms: Math.round(loaded), downloaded_mb: +(bytes / 1e6).toFixed(1)});
  out.textContent = JSON.stringify(report, null, 2);
  await fetch("/api/report", {method: "POST", body: JSON.stringify(report)});
})().catch(e => {
  document.getElementById("out").textContent = String(e);
  fetch("/api/report", {method: "POST", body: JSON.stringify({page: "pyodide", error: String(e)})});
});
</script>
</body>
</html>
